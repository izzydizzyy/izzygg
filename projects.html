<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Izzy! - Projects</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://discord.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://discord.com">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body {

    min-height:100vh;

    background:#0d0d0d;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    padding:40px 20px;

}


.container {

    text-align:center;

    max-width:800px;

}


h1 {

    font-size:60px;

    font-weight:800;

    letter-spacing:-2px;

}


.blurple {

    color:#5865F2;

    text-shadow:
    0 0 10px rgba(88,101,242,.8),
    0 0 25px rgba(88,101,242,.5);

}


.main-text {

    margin-top:15px;

    color:#a1a1a1;

    font-size:20px;

}

.back-link {

    display:inline-flex;

    align-items:center;

    gap:8px;

    margin-top:25px;

    color:#a1a1a1;

    text-decoration:none;

    font-size:14px;

    transition:.3s ease;

}


.back-link:hover {

    color:#5865F2;

}


/* Project Cards */

.projects {

    margin-top:40px;

    display:flex;

    flex-direction:column;

    gap:20px;

}


.project-card {

    background:#161616;

    border:1px solid #2a2a2a;

    border-radius:20px;

    padding:22px;

    text-align:left;

    transition:.3s ease;

}


.project-card:hover {

    transform:translateY(-5px);

    border-color:#5865F2;

    box-shadow:
    0 0 20px rgba(88,101,242,.35);

}


.project-top {

    display:flex;

    align-items:center;

    gap:15px;

}


.project-icon {

    width:60px;

    height:60px;

    border-radius:16px;

    background:#0d0d0d;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    flex-shrink:0;

}


.project-icon img {

    width:100%;

    height:100%;

    object-fit:cover;

}


.project-icon i {

    font-size:24px;

    color:#5865F2;

}


.project-info h3 {

    font-size:19px;

}


.project-info .role {

    margin-top:4px;

    font-size:14px;

    font-weight:bold;

}


.role-blue {
    color:#5865F2;
}


.role-orange {
    color:#e67e22;
}


.project-stats {

    margin-top:16px;

    display:flex;

    gap:22px;

    color:#a1a1a1;

    font-size:14px;

    flex-wrap:wrap;

}


.project-stats span {

    display:flex;

    align-items:center;

    gap:6px;

}


.join-link {

    margin-top:16px;

    display:inline-flex;

    align-items:center;

    gap:8px;

    background:#5865F2;

    color:white;

    text-decoration:none;

    font-size:14px;

    font-weight:bold;

    padding:9px 16px;

    border-radius:10px;

    transition:.3s ease;

}


.join-link:hover {

    background:#4752c4;

}


</style>

</head>


<body>


<div class="container">


<h1>
Hey, here's my <span class="blurple">Projects</span>
</h1>


<p class="main-text">
Servers I help manage and moderate
</p>


<a class="back-link" href="index.html">
<i class="fa-solid fa-arrow-left"></i>
Back to home
</a>



<div class="projects">


<div class="project-card">

<div class="project-top">

<div class="project-icon">
<i class="fa-brands fa-discord"></i>
</div>

<div class="project-info">
<h3>Fractured VR</h3>
<p class="role role-blue">Manager</p>
</div>

</div>

<div class="project-stats">

<span><i class="fa-solid fa-users"></i> 741 Members</span>

</div>

<a class="join-link" href="https://discord.gg/fracturedvr" target="_blank">
<i class="fa-brands fa-discord"></i> Join Discord
</a>

</div>



<div class="project-card">

<div class="project-top">

<div class="project-icon">
<i class="fa-brands fa-discord"></i>
</div>

<div class="project-info">
<h3>Dont Blink VR</h3>
<p class="role role-orange">Moderator</p>
</div>

</div>

<div class="project-stats">

<span><i class="fa-solid fa-users"></i> 3,058 Members</span>

</div>

<a class="join-link" href="https://discord.gg/tmPbWCWXgt" target="_blank">
<i class="fa-brands fa-discord"></i> Join Discord
</a>

</div>


</div>


</div>






</body>
</html>
