<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Izzyy</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://api.lanyard.rest" crossorigin>
<link rel="preconnect" href="https://cdn.discordapp.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://api.lanyard.rest">
<link rel="dns-prefetch" href="https://cdn.discordapp.com">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body {

    min-height:100vh;

    background:#000000;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    padding:40px 20px;

}


.container {

    text-align:center;

}


h1 {

    font-size:70px;

    font-weight:800;

    letter-spacing:-2px;

}


.blurple {

    color:#5865F2;

    text-shadow:
    0 0 10px rgba(88,101,242,.8),
    0 0 25px rgba(88,101,242,.5);

}


.main-text {

    margin-top:15px;

    color:#a1a1a1;

    font-size:20px;

}


.icons {

    margin-top:35px;

    display:flex;

    justify-content:center;

    gap:18px;

}


.icon {

    width:60px;

    height:60px;

    background:#0c0c0c;

    border:1px solid #232323;

    border-radius:16px;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    font-size:28px;

    text-decoration:none;

    cursor:pointer;

    transition:.3s ease;

}


.icon:hover {

    transform:translateY(-6px);

    color:#5865F2;

    border-color:#5865F2;

    box-shadow:
    0 0 15px rgba(88,101,242,.4);

}


.discord-card {

    margin:35px auto 0;

    width:350px;

    background:#0c0c0c;

    border:1px solid #232323;

    border-radius:20px;

    padding:20px;

    text-align:left;

    transition:.3s ease;

}


.discord-card:hover {

    transform:translateY(-5px);

    border-color:#5865F2;

    box-shadow:
    0 0 20px rgba(88,101,242,.35);

}



.discord-header {

    display:flex;

    align-items:center;

    justify-content:space-between;

    font-size:18px;

    font-weight:bold;

}

.discord-header-left {

    display:flex;

    align-items:center;

    gap:10px;

}


.discord-header i {

    color:#5865F2;

}


.discord-status {

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:12px;

    color:#a1a1a1;

    font-size:14px;

}


.status-dot {

    width:10px;

    height:10px;

    border-radius:50%;

    background:#23a559;

    flex-shrink:0;

}

.status-dot[data-status="online"] {
    background:#23a559;
}

.status-dot[data-status="idle"] {
    background:#f0b232;
}

.status-dot[data-status="dnd"] {
    background:#f23f43;
}

.status-dot[data-status="offline"] {
    background:#80848e;
}



.status-dot.vr {
    width:16px;
    height:16px;
    border-radius:50%;
    background:#23a559;
    display:flex;
    align-items:center;
    justify-content:center;
}

.status-dot.vr i {
    font-size:10px;
    color:#000000;
}



.discord-user {

    display:flex;

    align-items:center;

    gap:15px;

    margin-top:20px;

}


.avatar-wrap {

    position:relative;

    width:55px;

    height:55px;

    flex-shrink:0;

}


.discord-user img.avatar {

    width:55px;

    height:55px;

    border-radius:50%;

    display:block;

}


.avatar-decoration {

    position:absolute;

    top:-6px;

    left:-6px;

    width:67px;

    height:67px;

    pointer-events:none;

}



.discord-user h3 {

    font-size:18px;

}


.discord-user p {

    margin-top:5px;

    color:#888;

    font-size:14px;

}


/* Badges */

.badges {

    margin-top:16px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}

.badges.hidden {
    display:none;
}

.badge {

    width:26px;

    height:26px;

    border-radius:8px;

    background:#161616;

    border:1px solid #262626;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    color:#5865F2;

}


/* Spotify */

.spotify-card {

    margin-top:16px;

    padding-top:16px;

    border-top:1px solid #232323;

    display:none;

    align-items:center;

    gap:12px;

}

.spotify-card.show {
    display:flex;
}

.spotify-card img {

    width:46px;

    height:46px;

    border-radius:8px;

    flex-shrink:0;

}

.spotify-info {

    min-width:0;

    flex:1;

}

.spotify-info .sp-title {

    font-size:13px;

    font-weight:bold;

    color:#1DB954;

    display:flex;

    align-items:center;

    gap:6px;

}

.spotify-info .sp-song {

    margin-top:3px;

    font-size:13px;

    color:white;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.spotify-info .sp-artist {

    margin-top:2px;

    font-size:12px;

    color:#888;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.sp-bars {

    display:flex;

    align-items:flex-end;

    gap:2px;

    height:14px;

    flex-shrink:0;

}

.sp-bars span {

    width:3px;

    background:#1DB954;

    border-radius:1px;

    animation:sp-bounce 1s ease-in-out infinite;

}

.sp-bars span:nth-child(1){height:40%;animation-delay:0s;}
.sp-bars span:nth-child(2){height:100%;animation-delay:.2s;}
.sp-bars span:nth-child(3){height:60%;animation-delay:.4s;}

@keyframes sp-bounce {
    0%,100% { height:30%; }
    50% { height:100%; }
}


.notification {

    position:fixed;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);

    background:#5865F2;

    padding:12px 25px;

    border-radius:12px;

    opacity:0;

    pointer-events:none;

    transition:.3s ease;

}


.notification.show {

    opacity:1;

    bottom:50px;

}


/* Lanyard loading reminder */

.lanyard-reminder {

    position:fixed;

    top:30px;

    left:50%;

    transform:translateX(-50%);

    background:#0c0c0c;

    border:1px solid #232323;

    color:#a1a1a1;

    padding:12px 22px;

    border-radius:12px;

    font-size:14px;

    display:flex;

    align-items:center;

    gap:10px;

    opacity:0;

    filter:blur(8px);

    pointer-events:none;

    transition:opacity 1s ease, filter 1s ease;

    z-index:999;

}

.lanyard-reminder i {

    color:#5865F2;

}

.lanyard-reminder.show {

    opacity:1;

    filter:blur(0px);

}


/* Spotify embed player */

.spotify-embed-wrap {

    margin-top:16px;

    padding-top:16px;

    border-top:1px solid #232323;

    display:none;

}

.spotify-embed-wrap.show {
    display:block;
}

.spotify-embed-wrap iframe {

    border-radius:12px;

    width:100%;

}


</style>

</head>


<body>


<div class="container">


<h1>
Hey, I'm <span class="blurple">Izzy!</span>
</h1>


<p class="main-text">
Management - Programming - Moderation - VR
</p>


<a href="projects.html" style="display:inline-block;margin-top:20px;color:#5865F2;text-decoration:none;font-size:15px;font-weight:bold;">
View my Projects <i class="fa-solid fa-arrow-right"></i>
</a>



<div class="icons">


<div class="icon" onclick="copyDiscord()" title="Copy Discord">
<i class="fa-brands fa-discord"></i>
</div>


<a class="icon"
href="https://github.com/izzydizzyy"
target="_blank"
title="GitHub">

<i class="fa-brands fa-github"></i>

</a>



<a class="icon"
href="https://emoji.gg/user/iamizzyis.shai"
target="_blank"
title="Emoji.gg">

<i class="fa-regular fa-face-smile-beam"></i>

</a>


</div>



<div class="discord-card">


<div class="discord-header">

<div class="discord-header-left">
<i class="fa-brands fa-discord"></i>
<span>Live Discord</span>
</div>

</div>



<div class="discord-status">

<div class="status-dot" id="status-dot" data-status="online"></div>

<span id="status">Online</span>

</div>



<div class="discord-user">


<div class="avatar-wrap">
<img id="discord-avatar"
class="avatar"
src="https://cdn.discordapp.com/embed/avatars/0.png"
loading="eager"
decoding="async">
<img id="avatar-decoration" class="avatar-decoration" style="display:none;">
</div>


<div>

<h3 id="discord-name">
Loading...
</h3>


<p id="discord-activity">
Loading activity...
</p>


</div>


</div>


<div class="badges hidden" id="badges"></div>


<div class="spotify-embed-wrap" id="spotify-embed-wrap">

<iframe id="spotify-embed"
title="Spotify player"
frameborder="0"
allow="autoplay; encrypted-media; clipboard-write"
loading="lazy">
</iframe>

</div>


</div>


</div>



<div class="notification" id="notification">

Discord username copied!

</div>


<div class="lanyard-reminder" id="lanyard-reminder">
<i class="fa-brands fa-discord"></i>
<span>Reminder: My Lanyard may take a while to load.</span>
</div>



<script>


function copyDiscord(){

navigator.clipboard.writeText("izzy.js");


let notification =
document.getElementById("notification");


notification.classList.add("show");


setTimeout(()=>{

notification.classList.remove("show");

},2500);


}


const discordID = "1313630076809510975";


const statusLabels = {
    online:"Online",
    idle:"Idle",
    dnd:"Do Not Disturb",
    offline:"Offline"
};


// Common Discord public_flags badges (bitwise)
const BADGE_FLAGS = [
    { bit:1<<0,  icon:"fa-solid fa-user-shield",  title:"Discord Staff" },
    { bit:1<<1,  icon:"fa-solid fa-handshake",    title:"Partnered Server Owner" },
    { bit:1<<2,  icon:"fa-solid fa-bolt",         title:"HypeSquad Events" },
    { bit:1<<3,  icon:"fa-solid fa-bug",          title:"Bug Hunter Level 1" },
    { bit:1<<6,  icon:"fa-solid fa-house-chimney",title:"HypeSquad Bravery" },
    { bit:1<<7,  icon:"fa-solid fa-house-chimney",title:"HypeSquad Brilliance" },
    { bit:1<<8,  icon:"fa-solid fa-house-chimney",title:"HypeSquad Balance" },
    { bit:1<<9,  icon:"fa-solid fa-star",         title:"Early Supporter" },
    { bit:1<<14, icon:"fa-solid fa-bug",          title:"Bug Hunter Level 2" },
    { bit:1<<16, icon:"fa-solid fa-code",         title:"Early Verified Bot Developer" },
    { bit:1<<17, icon:"fa-solid fa-certificate",  title:"Discord Certified Moderator" },
    { bit:1<<22, icon:"fa-solid fa-hammer",       title:"Active Developer" }
];


function renderBadges(publicFlags){

    const container = document.getElementById("badges");

    container.innerHTML = "";

    if(!publicFlags){
        container.classList.add("hidden");
        return;
    }

    const owned = BADGE_FLAGS.filter(b => (publicFlags & b.bit) === b.bit);

    if(owned.length === 0){
        container.classList.add("hidden");
        return;
    }

    container.classList.remove("hidden");

    owned.forEach(b=>{
        const el = document.createElement("div");
        el.className = "badge";
        el.title = b.title;
        el.innerHTML = `<i class="${b.icon}"></i>`;
        container.appendChild(el);
    });

}


let currentSpotifyTrack = null;

function renderSpotify(user){

    const wrap = document.getElementById("spotify-embed-wrap");
    const iframe = document.getElementById("spotify-embed");

    if(user.listening_to_spotify && user.spotify && user.spotify.track_id){

        // Only reload the embed if the track actually changed, so it doesn't
        // restart itself every time the presence updates
        if(currentSpotifyTrack !== user.spotify.track_id){

            currentSpotifyTrack = user.spotify.track_id;

            iframe.src = `https://open.spotify.com/embed/track/${user.spotify.track_id}?utm_source=generator&theme=0&autoplay=1`;
            iframe.height = "152";

        }

        wrap.classList.add("show");

    } else {

        currentSpotifyTrack = null;
        wrap.classList.remove("show");
        iframe.src = "";

    }

}


function renderPresence(user){

    document.getElementById("discord-name").innerText =
    user.discord_user.global_name || user.discord_user.username;


    const avatar = user.discord_user.avatar;

    document.getElementById("discord-avatar").src =
    avatar
    ? `https://cdn.discordapp.com/avatars/${user.discord_user.id}/${avatar}.png?size=64`
    : "https://cdn.discordapp.com/embed/avatars/0.png";


    // Profile decoration
    const decoEl = document.getElementById("avatar-decoration");
    const decoration = user.discord_user.avatar_decoration_data;

    if(decoration && decoration.asset){
        decoEl.src = `https://cdn.discordapp.com/avatar-decoration-presets/${decoration.asset}.png?size=96`;
        decoEl.style.display = "block";
    } else {
        decoEl.style.display = "none";
    }


    if(user.activities && user.activities.length > 0){

    const activity = user.activities.find(a => a.type !== 4 && a.type !== 2) || user.activities[0];

    document.getElementById("discord-activity").innerText =
    activity.name;

    }

    else {

    document.getElementById("discord-activity").innerText =
    "No activity";

    }


    renderBadges(user.discord_user.public_flags);

    renderSpotify(user);


    const dot = document.getElementById("status-dot");

    const rawStatus = user.discord_status || "offline";

    dot.setAttribute("data-status", rawStatus);


    document.getElementById("status").innerText =
    statusLabels[rawStatus] || rawStatus;


    const onVR = user.activities && user.activities.some(a =>
    a.name && a.name.toLowerCase().includes("vr")
    );


    dot.classList.remove("vr");

    dot.innerHTML = "";


    if(rawStatus === "online" && onVR){

    dot.classList.add("vr");

    dot.innerHTML = '<i class="fa-solid fa-vr-cardboard"></i>';

    document.getElementById("status").innerText = "Online on VR";

    }

}


function setOffline(){

    document.getElementById("discord-activity").innerText = "Offline";

    document.getElementById("status-dot").setAttribute("data-status","offline");

    document.getElementById("status").innerText = "Offline";

    document.getElementById("spotify-card").classList.remove("show");

}


// Lanyard v2 - live via WebSocket, falls back to REST polling if it can't connect
let socket;
let heartbeatInterval;
let reconnectTimeout;

function connectLanyard(){

    try {

        socket = new WebSocket("wss://api.lanyard.rest/socket");

        socket.onopen = () => {

            socket.send(JSON.stringify({
                op:2,
                d:{ subscribe_to_id: discordID }
            }));

        };

        socket.onmessage = (event) => {

            const payload = JSON.parse(event.data);

            if(payload.op === 1){

                const interval = payload.d.heartbeat_interval;

                heartbeatInterval = setInterval(()=>{
                    if(socket.readyState === WebSocket.OPEN){
                        socket.send(JSON.stringify({ op:3 }));
                    }
                }, interval);

            }

            if(payload.t === "INIT_STATE" || payload.t === "PRESENCE_UPDATE"){

                renderPresence(payload.d);

            }

        };

        socket.onclose = () => {

            clearInterval(heartbeatInterval);

            reconnectTimeout = setTimeout(connectLanyard, 5000);

        };

        socket.onerror = () => {

            socket.close();

        };

    } catch(e){

        fallbackFetch();

    }

}


function fallbackFetch(){

    fetch(`https://api.lanyard.rest/v1/users/${discordID}`)
    .then(res=>res.json())
    .then(data=> renderPresence(data.data))
    .catch(setOffline);

}


connectLanyard();


// Lanyard loading reminder - fades in blurred, holds, fades out
window.addEventListener("DOMContentLoaded", () => {

    const reminder = document.getElementById("lanyard-reminder");

    setTimeout(()=>{

        reminder.classList.add("show");

        setTimeout(()=>{

            reminder.classList.remove("show");

        }, 4000);

    }, 400);

});


</script>


</body>
</html>
